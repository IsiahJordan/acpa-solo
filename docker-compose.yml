services:
  server:
    build:
      context: ./server 
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - "./server/.env"
    depends_on:
      - db 

  db:
    image: postgres:17.6
    container_name: acpa 
    restart: always
    environemnt:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
